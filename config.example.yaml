---
# Matrix / Synapse Configuration
# Configures connection to the Matrix homeserver and service registration
# details.
homeserverUrl: 'http://synapse:8008'
domain: 'docker.internal'
registrationPath: '/data/registration.yaml'

# Synapse-specific settings
# Controls retry behavior for admin operations
synapse:
  adminRetryMode: 'fallback'
  # Avatar upload settings (optional, shown with defaults)
  # avatarMaxSizeBytes: 5242880      # 5MB
  # avatarFetchTimeoutMs: 10000      # 10 seconds

# Database Configuration
# PostgreSQL connection details for storing application state and settings
database:
  engine: 'pg'
  host: 'postgres'
  name: 'tom_db'
  user: 'twake'
  password: 'twake_password'
  ssl: false
  vacuumDelay: 3600  # 1 hour in seconds

# RabbitMQ Configuration
# Message queue setup for publishing and consuming settings update events
rabbitmq:
  host: 'rabbitmq'
  port: 5672
  username: 'guest'
  password: 'guest'
  vhost: '/'
  tls: false
  # Primary queue for receiving settings update events
  queue: 'chat.settings.updated.queue'
  # Exchange for publishing settings updates
  exchange: 'settings.exchange'
  # Routing key for filtering settings update messages (defaults to '#' if
  # omitted)
  routingKey: 'user.settings.updated'
  # Dead-letter topology is provisioned automatically by the client as
  # '<exchange>.dlx' / '<queue>.dlq' / '<routingKey>.dead'.

# Account erasure on user deletion (optional, off when omitted)
# Deactivates and erases the Matrix account of each deleted user. Needs the
# bridge bot to be a homeserver admin.
# deletion:
#   exchange: 'auth'
#   routingKey: 'user.deleted'
#   queue: 'chat.user.deleted.queue'
#   # What the homeserver's SSO mapping named accounts after: 'uid' (the
#   # message's userId) or 'email' (the local part of its internalEmail)
#   localpartFrom: 'uid'

# Matrix spaces for TwakeSpace spaces (optional, off when omitted)
# Creates a Matrix space per space and keeps its members in line with their
# roles. Needs the bridge bot to be a homeserver admin.
# spaces:
#   # In SaaS the chat control plane forwards each organization's space events
#   # here; a single installation binds 'twake.space.#' on 'space' directly.
#   exchange: 'cs.instances.out.exchange'
#   routingKey: 'twake.space.#.<organization id>'
#   queue: 'chat.space.<organization id>.queue'
#   # Where the bridge announces each space's Matrix space
#   activityExchange: 'activity'
#   # What the homeserver's SSO mapping named accounts after: 'uid' (the
#   # member's username) or 'email' (the local part of their email)
#   localpartFrom: 'uid'
#   # TwakeSpace's app service user (default: '@twakespace:<domain>')
#   # twakeSpaceUserId: '@twakespace:example.com'
